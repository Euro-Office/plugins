# Local test server for the AI plugin: Euro-Office Document Server with this
# plugin mounted live, plus an optional local LLM (Ollama).
# Usage: see README.md in this folder.
name: eo-ai-plugin

services:
  documentserver:
    image: ghcr.io/euro-office/documentserver:${EO_TAG:-latest}
    ports:
      # Must be 80 on both sides: the example app builds document URLs from the
      # browser's host and port, and the server fetches them from inside the container.
      - "80:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${EO_JWT_SECRET:-local-dev-secret-at-least-32-chars-long}"
      EXAMPLE_ENABLED: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - "../..:/var/www/euro-office/documentserver/sdkjs-plugins/{9DC93CDB-B576-4F0C-B55E-FCC9C48DD007}:ro"
    configs:
      # Register the mounted plugin with the example app (loaded after its local.json).
      - source: example-plugins
        target: /etc/euro-office/documentserver-example/local-production-linux.json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # The plugin calls Ollama directly from the browser, so allow the editor origin.
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama:/root/.ollama

configs:
  example-plugins:
    content: |
      { "plugins": { "pluginsData": ["http://localhost/sdkjs-plugins/{9DC93CDB-B576-4F0C-B55E-FCC9C48DD007}/config.json"] } }

volumes:
  ollama:
