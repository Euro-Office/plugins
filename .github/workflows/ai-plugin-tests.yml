name: AI plugin tests

on:
  pull_request:
    paths:
      - 'sdkjs-plugins/content/ai/**'
      - '.github/workflows/ai-plugin-tests.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'sdkjs-plugins/content/ai/**'
      - '.github/workflows/ai-plugin-tests.yml'
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run the end-to-end test against a real Document Server'
        type: boolean
        default: false
      image:
        description: 'Document Server image for the e2e test'
        type: string
        default: 'onlyoffice/documentserver:9.1'
  schedule:
    # nightly e2e run
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ai-plugin-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdkjs-plugins/content/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sdkjs-plugins/content/ai/.dev/tests/package-lock.json
            sdkjs-plugins/content/ai/.dev/sidebar/package-lock.json

      - name: Syntax check (node --check) of all plugin scripts
        run: |
          find . -name '*.js' -not -path './vendor/*' -not -path '*/node_modules/*' -not -path './.dev/tests/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Validate JSON (config, translations, providers)
        run: |
          find . -name '*.json' -not -path './vendor/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      # scripts/helpers/helpers.js is generated from .dev/helpers but stays
      # committed: the repository contents are served as they are (GitHub
      # Pages / plugin store), without a build step. See .dev/helpers/README.md.
      - name: Generated helpers.js is in sync with .dev/helpers
        run: |
          (cd .dev/helpers && python3 helpers.py)
          git diff --exit-code -- scripts/helpers/helpers.js \
            || { echo "::error file=sdkjs-plugins/content/ai/scripts/helpers/helpers.js::helpers.js is out of date. Run: cd sdkjs-plugins/content/ai/.dev/helpers && python3 helpers.py"; exit 1; }

      # sidebar/ is built from .dev/sidebar but stays committed for the same
      # reason. See .dev/sidebar/README.md.
      - name: Install chat sidebar dependencies
        working-directory: sdkjs-plugins/content/ai/.dev/sidebar
        run: npm ci

      - name: Built chat sidebar is in sync with .dev/sidebar
        working-directory: sdkjs-plugins/content/ai/.dev/sidebar
        run: |
          npm run check \
            || { echo "::error file=sdkjs-plugins/content/ai/sidebar/sidebar.js::sidebar/ is out of date. Run: cd sdkjs-plugins/content/ai/.dev/sidebar && npm ci && npm run build"; exit 1; }

      - name: Chat sidebar tests
        working-directory: sdkjs-plugins/content/ai/.dev/sidebar
        run: npm test

      - name: Install test dependencies
        working-directory: sdkjs-plugins/content/ai/.dev/tests
        run: npm ci

      # Includes the helpers.js sync check again (needs python3, preinstalled
      # on ubuntu-latest; the test fails instead of skipping when CI is set).
      - name: Unit tests with coverage
        working-directory: sdkjs-plugins/content/ai/.dev/tests
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=text

  # Opt-in (manual or nightly): real Document Server + this plugin + Playwright,
  # with a scripted OpenAI-compatible stub. See .dev/tests/README.md.
  e2e:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdkjs-plugins/content/ai/.dev/tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdkjs-plugins/content/ai/.dev/tests/e2e/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Document Server with the plugin
        env:
          E2E_IMAGE: ${{ inputs.image || 'onlyoffice/documentserver:9.1' }}
        run: timeout 900 ./start-server.sh

      - name: End-to-end test
        run: npx playwright test

      - name: Server logs on failure
        if: failure()
        run: docker logs ai-plugin-e2e 2>&1 | tail -200
