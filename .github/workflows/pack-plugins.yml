name: Pack Plugins and Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack-plugins:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Pack plugins
      run: |
        python packer/pack.py

    - name: Bundle plugins
      run: |
        scripts/bundle.sh "$RUNNER_TEMP/sdkjs-plugins"
        scripts/check-bundle.sh "$RUNNER_TEMP/sdkjs-plugins"
        tar -czf "artifacts/sdkjs-plugins-$GITHUB_REF_NAME.tar.gz" -C "$RUNNER_TEMP/sdkjs-plugins" .

    - name: Upload GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: Release for commit `${{ github.sha }}`
        files: |
          artifacts/*.plugin
          artifacts/sdkjs-plugins-${{ github.ref_name }}.tar.gz
